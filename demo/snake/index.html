<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #1a1a2e;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  </style>
</head>
<body>
<div id="container"></div>

<script src="https://cdn.jsdelivr.net/gh/Lodymain/Prism2D.js@main/build/prism2d.min.js"></script>

<script>
prism(400, 400, "container")
  .mode("pixel")
  .quality("master")
  .bg("#0f3460");

var GRID_SIZE = 20;
var COLS = 20;
var ROWS = 20;
var INITIAL_SPEED = 0.12;

var gameState = {
  snake: [],
  food: { x: 10, y: 10 },
  direction: { x: 1, y: 0 },
  nextDirection: { x: 1, y: 0 },
  score: 0,
  gameOver: false,
  speedMultiplier: 1,
  moveCounter: 0
};

function initSnake() {
  gameState.snake = [
    { x: 10, y: 10 },
    { x: 9, y: 10 },
    { x: 8, y: 10 }
  ];
  gameState.direction = { x: 1, y: 0 };
  gameState.nextDirection = { x: 1, y: 0 };
  gameState.score = 0;
  gameState.gameOver = false;
  gameState.speedMultiplier = 1;
  gameState.moveCounter = 0;
  spawnFood();
}

function spawnFood() {
  var isOnSnake = true;
  while (isOnSnake) {
    gameState.food = {
      x: Math.floor(Math.random() * COLS),
      y: Math.floor(Math.random() * ROWS)
    };
    isOnSnake = false;
    for (var i = 0; i < gameState.snake.length; i++) {
      if (gameState.snake[i].x === gameState.food.x && 
          gameState.snake[i].y === gameState.food.y) {
        isOnSnake = true;
        break;
      }
    }
  }
}

function checkSelfCollision() {
  var head = gameState.snake[0];
  for (var i = 1; i < gameState.snake.length; i++) {
    if (head.x === gameState.snake[i].x && head.y === gameState.snake[i].y) {
      return true;
    }
  }
  return false;
}

function checkWallCollision() {
  var head = gameState.snake[0];
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    return true;
  }
  return false;
}

function resetGame() {
  gameState.gameOver = false;
  initSnake();
}

prism.scene("play")
  .on("update", function (dt) {
    if (gameState.gameOver) {
      if (prism.keyHit("Space")) {
        resetGame();
      }
      return;
    }

    if (prism.keyHit("ArrowRight") || prism.keyHit("d")) {
      if (gameState.direction.x !== -1) {
        gameState.nextDirection = { x: 1, y: 0 };
      }
    }
    if (prism.keyHit("ArrowLeft") || prism.keyHit("a")) {
      if (gameState.direction.x !== 1) {
        gameState.nextDirection = { x: -1, y: 0 };
      }
    }
    if (prism.keyHit("ArrowDown") || prism.keyHit("s")) {
      if (gameState.direction.y !== -1) {
        gameState.nextDirection = { x: 0, y: 1 };
      }
    }
    if (prism.keyHit("ArrowUp") || prism.keyHit("w")) {
      if (gameState.direction.y !== 1) {
        gameState.nextDirection = { x: 0, y: -1 };
      }
    }

    gameState.moveCounter += INITIAL_SPEED * gameState.speedMultiplier;
    
    if (gameState.moveCounter >= 1) {
      gameState.moveCounter = 0;
      gameState.direction = gameState.nextDirection;
      
      var head = gameState.snake[0];
      var newHead = {
        x: head.x + gameState.direction.x,
        y: head.y + gameState.direction.y
      };

      if (checkWallCollision.call(
            { snake: gameState.snake.concat([newHead]) },
            newHead
          ) || head.x + gameState.direction.x < 0 || 
          head.x + gameState.direction.x >= COLS ||
          head.y + gameState.direction.y < 0 || 
          head.y + gameState.direction.y >= ROWS) {
        gameState.gameOver = true;
        return;
      }

      gameState.snake.unshift(newHead);

      if (newHead.x === gameState.food.x && newHead.y === gameState.food.y) {
        gameState.score += 10;
        gameState.speedMultiplier += 0.1;
        spawnFood();
      } else {
        gameState.snake.pop();
      }

      if (checkSelfCollision()) {
        gameState.gameOver = true;
      }
    }
  })
  .on("draw", function () {
    for (var x = 0; x < COLS; x++) {
      for (var y = 0; y < ROWS; y++) {
        prism.drawRectLine(
          x * GRID_SIZE, 
          y * GRID_SIZE, 
          GRID_SIZE, 
          GRID_SIZE, 
          "#16213e", 
          1
        );
      }
    }

    prism.drawRect(
      gameState.food.x * GRID_SIZE + 2,
      gameState.food.y * GRID_SIZE + 2,
      GRID_SIZE - 4,
      GRID_SIZE - 4,
      "#e94560"
    );

    for (var i = 0; i < gameState.snake.length; i++) {
      var segment = gameState.snake[i];
      var color = i === 0 ? "#00d4ff" : "#0aff0a";
      
      prism.drawRect(
        segment.x * GRID_SIZE + 2,
        segment.y * GRID_SIZE + 2,
        GRID_SIZE - 4,
        GRID_SIZE - 4,
        color
      );

      if (i === 0) {
        prism.drawCircle(
          segment.x * GRID_SIZE + 6,
          segment.y * GRID_SIZE + 6,
          1.5,
          "#fff"
        );
        prism.drawCircle(
          segment.x * GRID_SIZE + 14,
          segment.y * GRID_SIZE + 6,
          1.5,
          "#fff"
        );
      }
    }

    prism.drawText("Score: " + gameState.score, 10, 10, {
      color: "#00d4ff",
      size: 14,
      bold: true,
      outline: true,
      outlineColor: "#000",
      outlineWidth: 2
    });

    prism.drawText("Length: " + gameState.snake.length, 10, 28, {
      color: "#0aff0a",
      size: 14,
      bold: true,
      outline: true,
      outlineColor: "#000",
      outlineWidth: 2
    });

    if (gameState.gameOver) {
      prism.alpha(0.7);
      prism.drawRect(0, 0, 400, 400, "#000");
      prism.alpha(1);

      prism.drawText("GAME OVER", 70, 150, {
        color: "#e94560",
        size: 36,
        bold: true,
        outline: true,
        outlineColor: "#000",
        outlineWidth: 3
      });

      prism.drawText("Final Score: " + gameState.score, 95, 200, {
        color: "#00d4ff",
        size: 16,
        outline: true,
        outlineColor: "#000",
        outlineWidth: 2
      });

      prism.drawText("Press SPACE to play again", 65, 250, {
        color: "#0aff0a",
        size: 14,
        outline: true,
        outlineColor: "#000",
        outlineWidth: 2
      });
    }
  });

initSnake();
prism.play("play").loop();
</script>
</body>
</html>
